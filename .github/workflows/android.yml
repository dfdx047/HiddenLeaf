# Builds the Hidden Leaf Android app (android/): a build check on every push and pull request, with the APK as an
# artifact of the run. The engine is not built here yet (it is generated from the player's ELF, recomp/).
#
# Release signing: repository secrets HL_KEYSTORE_BASE64 (the .jks, base64), HL_KEYSTORE_PASSWORD, HL_KEY_ALIAS and
# HL_KEY_PASSWORD. Without them the APK is signed with the test key in android/app (fine for testing, not for
# publishing).
name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # has the Android SDK; ANDROID_HOME is set
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KS: ${{ secrets.HL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          HL_KEYSTORE_PASSWORD: ${{ secrets.HL_KEYSTORE_PASSWORD }}
          HL_KEY_ALIAS: ${{ secrets.HL_KEY_ALIAS }}
          HL_KEY_PASSWORD: ${{ secrets.HL_KEY_PASSWORD }}
          HL_VERSION_NAME: 0.1.0-dev.${{ github.run_number }}
          HL_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HiddenLeaf-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
